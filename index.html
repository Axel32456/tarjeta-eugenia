<!DOCTYPE html>
<html>

<head>

    <title>Tarjeta para Eugenia</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        html
        {
            width: 100%;
            height: 100%;
        }

        body
        {
            width: 100%;
            background-color: lightpink;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "Trebuchet MS", Arial, sans-serif;
        }

        button
        {
            background-color: #d84b7a;
            color: white;
            font-size: 26px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
        }

        #contador
        {
            background-color: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 16px gray;
            color: deeppink;
            font-size: 23px;
            font-weight: bold;
            margin: 0;
            width: 80%;
            max-width: 600px;
            box-sizing: border-box;
            text-align: center;
        }

        #mensajeContador
        {
            display: block;
            margin-bottom: 12px;
        }

        #tiempoContador
        {
            display: block;
        }

        #controlesMusica
        {
            position: fixed;
            top: 2vh;
            right: 2vw;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1vh;
            padding: 1.5vh;
            background-color: white;
            border-radius: 1vw;
            box-shadow: 0 4px 16px gray;
            width: clamp(180px, 20vw, 280px);
            box-sizing: border-box;
            flex-direction: column;
        }

        #controlesMusica button
        {
            font-size: clamp(10px, 1vw, 14px);
            padding: 0.7vw 0.8vw;
        }

        #controlesMusica label
        {
            color: deeppink;
            font-weight: bold;
            font-size: clamp(10px, 1vw, 14px);
        }

        #volumen
        {
            accent-color: deeppink;
            width: 100%;
        }

        #tituloMusica
        {
            margin: 0;
            color: deeppink;
            font-size: clamp(11px, 1.2vw, 16px);
            font-weight: bold;
        }

        #botonesMusica
        {
            display: flex;
            gap: 0.5vw;
        }

        #fondoAnimado
        {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
        }

        #fondoAnimado span
        {
            position: absolute;
            font-size: 30px;
            animation: flotar 8s linear infinite;
        }

        @keyframes flotar
        {
            from
            {
                transform: translateY(100vh);
                opacity: 0;
            }

            20%
            {
                opacity: 1;
            }

            80%
            {
                opacity: 1;
            }

            to
            {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        #fondoAnimado span:nth-child(1)
        {
            left: 10%;
            font-size: 20px;
            animation-duration: 7s;
        }

        #fondoAnimado span:nth-child(2)
        {
            left: 25%;
            font-size: 30px;
            animation-duration: 9s;
        }

        #fondoAnimado span:nth-child(3)
        {
            left: 40%;
            font-size: 25px;
            animation-duration: 6s;
        }

        #fondoAnimado span:nth-child(4)
        {
            left: 55%;
            animation-duration: 10s;
        }

        #fondoAnimado span:nth-child(5)
        {
            left: 70%;
            animation-duration: 8s;
        }

        #fondoAnimado span:nth-child(6)
        {
            left: 85%;
            animation-duration: 7s;
        }

        #fondoAnimado span:nth-child(7)
        {
            left: 35%;
            animation-duration: 11s;
        }

        #fondoAnimado span:nth-child(8)
        {
            left: 65%;
            animation-duration: 9s;
        }

        #videoFondo
        {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
            z-index: -3;
            filter: brightness(0.7);
            display: block;
        }

        #capaFondo
        {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(255, 182, 193, 0.5);
            z-index: -2;
        }

        @media(max-width: 600px)
        {
            #contador
            {
                width: 90%;
                font-size: 18px;
                padding: 16px;
            }
        }

    </style>

</head>

<body>

    <video id="videoFondo" autoplay muted playsinline preload="auto">

        <source src="fondo.mp4" type="video/mp4">

    </video>

    <div id="capaFondo"></div>

    <div id="fondoAnimado">

        <span>💗</span>
        <span>✨</span>
        <span>💕</span>
        <span>🌸</span>
        <span>💗</span>
        <span>✨</span>
        <span>💕</span>
        <span>🌸</span>

    </div>

    <div id="controlesMusica">

        <p id="tituloMusica">
            ¿Querés escuchar música mientras esperás?
        </p>

        <div id="botonesMusica">

            <button id="botonAnterior">
                ⏮
            </button>

            <button id="botonMusica">
                ▶
            </button>

            <button id="botonPausa">
                ⏸
            </button>

            <button id="botonSiguiente">
                ⏭
            </button>

        </div>

        <label for="volumen">
            Volumen 🔊
        </label>

        <input id="volumen" type="range" min="0" max="1" step="0.1" value="0.5">

    </div>

    <audio id="musica"></audio>

    <p id="contador">

        <span id="mensajeContador"></span>

        <span id="tiempoContador"></span>

    </p>

    <script>

        const fechaCumple = new Date("2026-08-29T00:00:00-03:00");

        const modoPrueba = false;

        const botonMusica = document.getElementById("botonMusica");

        const musica = document.getElementById("musica");

        const botonPausa = document.getElementById("botonPausa");

        const volumen = document.getElementById("volumen");

        const contador = document.getElementById("contador");

        const mensajeContador = document.getElementById("mensajeContador");

        const tiempoContador = document.getElementById("tiempoContador");

        const videoFondo = document.getElementById("videoFondo");

        const botonAnterior = document.getElementById("botonAnterior");

        const botonSiguiente = document.getElementById("botonSiguiente");

        const tituloMusica = document.getElementById("tituloMusica");

        const canciones =
        [
            "musica3.mp3",
            "musica2.mp3",
            "musica1.mp3",
            "musica.mp3"
        ];

        let indiceCancion = 0;

        let ahoraOficial;

        let momentoConsulta;

        musica.volume = volumen.value;

        musica.src = canciones[indiceCancion];

        async function obtenerHora()
        {
            const respuesta = await fetch("https://timeapi.io/api/time/current/zone?timeZone=America/Argentina/Buenos_Aires");

            const datos = await respuesta.json();

            ahoraOficial = new Date(datos.dateTime);

            momentoConsulta = Date.now();
        }

        function actualizarContador()
        {
            const tiempoTranscurrido = Date.now() - momentoConsulta;

            const ahora = new Date(ahoraOficial.getTime() + tiempoTranscurrido);

            const diferencia = fechaCumple - ahora;

            if(modoPrueba)
            {
                contador.style.display = "block";

                return;
            }

            if(diferencia <= 0)
            {
                mensajeContador.textContent = "Si estás viendo esto es porque adelantes el reloj, pesimo la verdad....🙄🙄🙄";

                tiempoContador.textContent = "";

                return;
            }

            const segundos = diferencia / 1000;

            const segundosEnteros = Math.floor(segundos);

            const diasEnteros = Math.floor(segundosEnteros / 86400);

            const segundosRestantes = segundosEnteros % 86400;

            const horasEnteras = Math.floor(segundosRestantes / 3600);

            const segundosDespuesDeHoras = segundosRestantes % 3600;

            const minutosEnteros = Math.floor(segundosDespuesDeHoras / 60);

            const segundosEnterosRestantes = segundosDespuesDeHoras % 60;

            const diasTexto = String(diasEnteros).padStart(2, "0");

            const horasTexto = String(horasEnteras).padStart(2, "0");

            const minutosTexto = String(minutosEnteros).padStart(2, "0");

            const segundosTexto = String(segundosEnterosRestantes).padStart(2, "0");

            mensajeContador.textContent = "¡Falta poco para tu sorpresa!";

            tiempoContador.textContent = diasTexto + " días, " + horasTexto + " horas, " + minutosTexto + " minutos y " + segundosTexto + " segundos";
        }

        obtenerHora().then(
            function()
            {
                actualizarContador();

                setInterval(actualizarContador,1000);

                setInterval(
                    function()
                    {
                        obtenerHora();
                    },
                    60000
                );
            }
        );

        botonMusica.addEventListener("click",
            function()
            {
                musica.play();
            }
        );

        botonPausa.addEventListener(
            "click",
            function()
            {
                musica.pause();
            }
        );

        volumen.addEventListener(
            "input",
            function()
            {
                musica.volume = volumen.value;
            }
        );

        botonSiguiente.addEventListener(
            "click",
            function()
            {
                indiceCancion++;

                if(indiceCancion >= canciones.length)
                {
                    indiceCancion = 0;
                }

                musica.src = canciones[indiceCancion];

                musica.play();
            }
        );

        botonAnterior.addEventListener(
            "click",
            function()
            {
                indiceCancion--;

                if(indiceCancion < 0)
                {
                    indiceCancion = canciones.length - 1;
                }

                musica.src = canciones[indiceCancion];

                musica.play();
            }
        );

        musica.addEventListener("ended",
            function()
            {
                indiceCancion++;

                if(indiceCancion >= canciones.length)
                {
                    indiceCancion = 0;
                }

                musica.src = canciones[indiceCancion];

                musica.play();
            }
        );

        videoFondo.addEventListener("ended",
            function()
            {
                videoFondo.currentTime = 0;

                videoFondo.play().catch(
                    function(error)
                    {
                        console.error("No se pudo reproducir el video:", error);
                    }
                );
            }
        );

    </script>

</body>

</html>
