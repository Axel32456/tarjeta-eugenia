<!DOCTYPE html>
<html>
    <head> 
        <title> Tarjeta para Eugenia </title> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            html
            {
                width: 100%;
                height: 100%;
            }

            body
            {
                background-color: lightpink;
                text-align: center;
                margin: 0;
                min-height: 100vh;
                overflow: hidden;
                
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: "Trebuchet MS", Arial, sans-serif;;
            }

            h1
            {
                color: deeppink;
                font-size: 36px;
                max-width: 100%;
                font-family: Georgia, "Times New Roman", serif;
            }

            button
            {
                background-color: #d84b7a;
                color: white;
                font-size: 26px;
                padding: 12px;
                border-radius: 12px;
                border: none;
                cursor: pointer;
            }

            #mensajeSorpresa
            {
                display: none;
                font-size: 22px;
                margin-top: 24px;
            }

            #contador
            {
                background-color: white;
                padding: 20px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                color: deeppink;
                font-size: 23px;
                font-weight: bold;
                margin-top: 20px;
                max-width: 80%;
                box-sizing: border-box;
                text-align: center;
            }

            #tarjeta
            {
                display: none;
                background-color: white;
                padding: 32px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 500px;
                box-sizing: border-box;
            }

            #confeti
            {
                display: none;
                font-size: 40px;
                margin-top: 24px;
            }

            .confetiAnimado
            {
                animation: saltar 2s ease forwards;
            }

            @keyframes saltar{
                from
                {
                    opacity: 0;
                    transform: translateY(0);
                }

                to
                {
                    opacity: 1;
                    transform: translateY(-50px);
                }
            }

            #controlesMusica {
                position: fixed;
                top: 16px;
                right: 20px;
                z-index: 10;

                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;

                max-width: 280px;
                padding: 16px;
                background-color: white;
                border-radius: 16px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 280px;
                box-sizing: border-box;
                flex-direction: column;
            }

            #controlesMusica button
            {
                font-size: 14px;
                padding: 10px 10px;
            }

            #controlesMusica label
            {
                color: deeppink;
                font-weight: bold;
            }

            #volumen
            {
                accent-color: deeppink;
                width: 100%;
            }

            #tituloMusica
            {
                margin: 0;
                color: deeppink;
                font-size: 16px;
                font-weight: bold;
            }

            #botonesMusica
            {
                display: flex;
                gap: 10px;
            }

            @media (max-width: 600px)
            {
                h1
                {
                    font-size: 30px;
                }

                #tarjeta
                {
                    padding: 24px;
                }

                #contador
                {
                    font-size: 18px;
                    padding: 16px;
                }

                #controlesMusica
                {
                    top: 10px;
                    right: 10px;
                    width: 180px;
                    padding: 12px;
                }

                #tituloMusica
                {
                    font-size: 14px;
                }

                #controlesMusica button
                {       
                    font-size: 12px;
                    padding: 8px;
                }
            }

            #menu
            {
                display: none;
                background-color: white;
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 400px;
                box-sizing: border-box;
            }

            #menu h2
            {
                color: deeppink;
                font-family: Georgia, 'Times New Roman', serif;
                margin-top: 0;
            }

            #menu button
            {
                display: block;
                width: 100%;
                margin-top: 12px;
                font-size: 20px;
            }

            #carta
            {
                display: none;
                position: relative;
                background-color: #fff8e7;
                padding: 40px;
                border-radius: 8px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 550px;
                box-sizing: border-box;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
                color: #4a3525;

                background-image: repeating-linear-gradient(
                    0deg, rgba(150, 120, 80, 0.04) 0px, rgba(150, 120, 80, 0.04)1px, transparent 1px, transparent 4px);

                animation: aparecerCarta 1s ease;
            }

            #carta h2
            {
                color: deeppink;
                font-family: Georgia, 'Times New Roman', serif;
            }

            #carta p
            {
                font-size: 20px;
            }

            #fondoAnimado
            {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                pointer-events: none;
                z-index: -1;
            }

            #fondoAnimado span
            {
                position: absolute;
                font-size: 30px;
                animation: flotar 8s linear infinite;
            }

            @keyframes flotar
            {
                from
                {
                    transform: translateY(100vh);
                    opacity: 0;
                }

                20%
                {
                    opacity: 1;
                }

                80%
                {
                    opacity: 1;
                }

                to
                {
                    transform: translateY(-100px);
                    opacity: 0;
                }
            }

            @keyframes aparecerCarta
            {
                from
                {
                    opacity: 0;
                    transform: translateY(30px) rotate(-2deg);
                }

                to
                {
                    opacity: 1;
                    transform: translateY(0) rotate(0deg);
                }
            }

            #fondoAnimado span:nth-child(1)
            {
                left: 10%;
                font-size: 20px;
                animation-duration: 7s;
            }

            #fondoAnimado span:nth-child(2)
            {
                left: 25%;
                font-size: 30px;
                animation-duration: 9s;
            }

            #fondoAnimado span:nth-child(3)
            {
                left: 40%;
                font-size: 25px;
                animation-duration: 6s;
            }
            
            #fondoAnimado span:nth-child(4)
            {
                left: 55%;
                animation-duration: 10s;
            }
            #fondoAnimado span:nth-child(5)
            {
                left: 70%;
                animation-duration: 8s;
            }

            #fondoAnimado span:nth-child(6)
            {
                left: 85%;
                animation-duration: 7s;
            }

            #fondoAnimado span:nth-child(7)
            {
                left: 35%;
                animation-duration: 11s;
            }

            #fondoAnimado span:nth-child(8)
            {
                left: 65%;
                animation-duration: 9s;
            }

            #videoFondo
            {
                position: fixed;
                inset: 0;
                left: 0;

                width: 100vw;
                height: 100vh;

                object-fit: cover;
                object-position: center;

                z-index: -3;

                filter: brightness(0.7);
            }

            #capaFondo
            {
                position: fixed;

                top: 0;
                inset: 0;

                width: 100vw;
                height: 100vh;

                background-color: rgba(255, 182, 193, 0.5);

                z-index: -2;
            }

            #carta #botonVolver
            {
                display: none;
            }

            #carta button
            {
                display: block;
                width: 100%;
                margin: 12px auto 0 auto;
                font-size: 20px;
            }

            #imagenMenu
            {
                position: fixed;
                inset: 0;

                width: 100%;
                height: 100%;

                background-image: url("fondoMenu.png");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;

                z-index: -3;

                display: none;
            }
        </style>

    </head>

    <body>
        <video id="videoFondo" autoplay muted playsinline preload="auto">
            <source src="fondo.mp4" type="video/mp4">
        </video>

        <div id="capaFondo"></div>
        
        <img id="imagenMenu" src="fondoMenu.png">

        <div id="fondoAnimado">
            <span>💗</span>
            <span>✨</span>
            <span>💕</span>
            <span>🌸</span>
            <span>💗</span>
            <span>✨</span>
            <span>💕</span>
            <span>🌸</span>
        </div>

        <div id="menu">
            <h2>¿Por donde querés empezar 💗</h2>

            <button id="botonMenuCarta">💌 Carta</button>
            <button>🔐 Juego de la Caja fuerte</button>
        </div>

        <div id="carta">
            <h2>💌 Para vos</h2>

            <p id="textoCarta"></p>

            <button id="botonCarta">Abrir carta 💗</button>
            <button id="botonVolver">Volver al menú</button>
        </div>

        <div id="controlesMusica">
            <p id="tituloMusica">¿Querés escuchar algo de música mientras esperás?</p>
            <div id="botonesMusica">
                <button id="botonMusica">▶ Reproducir</button>
                <button id="botonPausa">⏸ Pausar</button>
            </div>

            <label for="volumen">Volumen</label>
            <input id="volumen" type="range" min="0" max="1" step="0.1" value="0.5">
        </div>

        <audio id="musica" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
        <p id="contador"></p>

        <script> 
        const fechaCumple = new Date("2026-08-22T00:00:00-03:00")
        const modoPrueba = false
        const probarMenu = true
        const botonMusica  = document.getElementById("botonMusica")
        const musica = document.getElementById("musica")
        const botonPausa = document.getElementById("botonPausa")
        const volumen = document.getElementById("volumen")
        const menu = document.getElementById("menu")
        const botonCarta = document.getElementById("botonCarta")
        const carta = document.getElementById("carta")
        const botonMenuCarta = document.getElementById("botonMenuCarta")
        const fondoAnimado  = document.getElementById("fondoAnimado")
        const videoFondo   = document.getElementById("videoFondo")
        const capaFondo    = document.getElementById("capaFondo")
        const textoCarta     = document.getElementById("textoCarta")
        const botonVolver = document.getElementById("botonVolver")
        const imagenMenu = document.getElementById("imagenMenu")
        const texto = "Hay algo que quiero decirte..."
        const textoReal = "Eugenia, hoy es tu cumpleaños y espero que estas palabras alcancen por lo menos a reflejar lo mucho que te quiero. Gracias por siempre estar, por todos tus regalos y por lo momentos lindos que generas."

        let posicion = 0
        let cartaEscrita = false
        let pantalla = "menu"
        let ahoraOficial
        let momentoConsulta
        



        musica.volume = volumen.value
        
        function escribirCarta()
        {
            if(cartaEscrita)
            {
                return
            }

            if(posicion < texto.length)
            {
                textoCarta.textContent += texto[posicion]

                posicion++

                setTimeout(escribirCarta, 80)
            }

            else
            {
                cartaEscrita = true
            }
        }

        function abrirCarta()
        {
            textoCarta.textContent = ""
            posicion = 0

            escribirTextoReal()
        }

        function escribirTextoReal()
        {
            if(posicion < textoReal.length)
            {
                textoCarta.textContent += textoReal[posicion]

                posicion++

                setTimeout(escribirTextoReal, 80);
            }
        }

        async function obtenerHora() 
        {
            const respuesta = await fetch("https://timeapi.io/api/time/current/zone?timeZone=America/Argentina/Buenos_Aires")
            const datos = await respuesta.json()

            ahoraOficial = new Date(datos.dateTime)
            momentoConsulta = Date.now()
        }

        function actualizarContador()
        {
            const tiempoTranscurrido = new Date() - momentoConsulta
            const ahora = new Date(ahoraOficial.getTime() + tiempoTranscurrido)

            const diferencia = fechaCumple - ahora
            const contador = document.getElementById("contador")

            if(probarMenu)
            {
                if(pantalla == "menu")
                {
                    menu.style.display = "block"
                    carta.style.display = "none"
                    contador.style.display = "none"

                    fondoAnimado.style.display = "block"

                    videoFondo.style.display = "block"
                    capaFondo.style.display = "block"

                    imagenMenu.style.display = "block"
                }

                return
            }

            if(modoPrueba)
            {
                if(pantalla == "menu")
                {
                    menu.style.display = "block"
                    carta.style.display = "none"
                    contador.style.display = "none"
                    fondoAnimado.style.display = "block"
                    videoFondo.style.display = "block"
                    capaFondo.style.display = "block"
                    imagenMenu.style.display = "block"
                }

                return 
            }

            if(diferencia > 0)
            {
                menu.style.display = "none"
                carta.style.display = "none"
                contador.style.display = "block"
                fondoAnimado.style.display = "block"
                videoFondo.style.display = "block"
                capaFondo.style.display = "block"
            }

            else
            {
                menu.style.display = "block"
                carta.style.display = "none"
                contador.style.display = "none"
                fondoAnimado.style.display = "none"
                videoFondo.style.display = "none"
                capaFondo.style.display = "none"
                imagenMenu.style.display = "block"
                musica.style.display = "none"

                return 
            }

            const segundos = diferencia/1000
            const segundosEnteros = Math.floor(segundos)

            const dias = segundosEnteros/86400
            const diasEnteros = Math.floor(dias)

            const segundosRestantes = segundosEnteros % 86400
            const horas = segundosRestantes/3600
            const horasEnteras = Math.floor(horas)
            const segundosDespuesDeHoras = segundosRestantes % 3600

            const minutos = segundosDespuesDeHoras / 60
            const minutosEnteros = Math.floor(minutos)

            const segundosEnterosRestantes = segundosDespuesDeHoras % 60

            const diasTexto = String(diasEnteros).padStart(2, "0")
            const horasTexto = String(horasEnteras).padStart(2, "0")
            const minutosTexto = String(minutosEnteros).padStart(2, "0")
            const segundosTexto = String(segundosEnterosRestantes).padStart(2, "0")
            
            contador.textContent = "Aunque tu cumpleaños está cada vez más cerca faltan: " + diasTexto + " días, " + horasTexto + " horas, " + minutosTexto + " minutos y " + segundosTexto + " segundos"
        }   

        obtenerHora().then(function()
        {
            actualizarContador()
            setInterval(actualizarContador, 1000)

            setInterval(function()
            {
                obtenerHora()
            }, 60000)
        })

        botonMusica.addEventListener("click", function()
        {
            musica.play()
        })

        botonPausa.addEventListener("click", function()
        {
            musica.pause()
        })

        volumen.addEventListener("input", function()
        {
            musica.volume = volumen.value
        })

        botonCarta.addEventListener("click", function()
        {
            botonCarta.style.display = "none"
            botonVolver.style.display = "block"

            abrirCarta()
        })

        botonMenuCarta.addEventListener("click", function()
        {
            pantalla = "carta"

            menu.style.display = "none"
            carta.style.display = "block"

            botonCarta.style.display = "block"
            botonVolver.style.display = "none"

            textoCarta.textContent = ""
            posicion = 0

            if(!cartaEscrita)
            {
                escribirCarta()
            }
        })

        botonVolver.addEventListener("click", function()
        {
            pantalla = "menu"

            carta.style.display = "none"
            menu.style.display = "block"

            botonCarta.style.display = "block"
            botonVolver.style.display = "none"

            textoCarta.textContent = ""
            posicion = 0
            cartaEscrita = false
        })

        videoFondo.addEventListener("ended", function()
{
    console.log("Evento ended disparado")

    videoFondo.currentTime = 0

    videoFondo.play().then(function()
    {
        console.log("play() exitoso")
    }).catch(function(error)
    {
        console.error("play() falló:", error)
    })
})

videoFondo.addEventListener("timeupdate", function()
{
    if(videoFondo.duration && videoFondo.currentTime >= videoFondo.duration - 0.2)
    {
        videoFondo.currentTime = 0

        videoFondo.play().catch(function(error)
        {
            console.error("No se pudo reanudar el video:", error)
        })
    }
})
        
        </script>

    </body>
</html>
