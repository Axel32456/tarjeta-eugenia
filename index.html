<!DOCTYPE html>
<html>
    <head> 
        <title> Tarjeta para Eugenia </title> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body
            {
                background-color: lightpink;
                text-align: center;
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: "Trebuchet MS", Arial, sans-serif;;
            }

            h1
            {
                color: deeppink;
                font-size: 36px;
                max-width: 100%;
                font-family: Georgia, "Times New Roman", serif;
            }

            button
            {
                background-color: #d84b7a;
                color: white;
                font-size: 26px;
                padding: 12px;
                border-radius: 12px;
                border: none;
                cursor: pointer;
            }

            #mensajeSorpresa
            {
                display: none;
                font-size: 22px;
                margin-top: 24px;
            }

            #contador
            {
                background-color: white;
                padding: 20px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                color: deeppink;
                font-size: 24px;
                font-weight: bold;
                margin-top: 20px;
                max-width: 80%;
                box-sizing: border-box;
                text-align: center;
            }

            #tarjeta
            {
                background-color: white;
                padding: 32px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 500px;
                box-sizing: border-box;
            }

            #confeti
            {
                font-size: 40px;
                margin-top: 24px;
            }

            .confetiAnimado
            {
                animation: saltar 2s ease forwards;
            }

            @keyframes saltar{
                from
                {
                    opacity: 0;
                    transform: translateY(0);
                }

                to
                {
                    opacity: 1;
                    transform: translateY(-50px);
                }
            }

            #controlesMusica {
                position: fixed;
                top: 16px;
                right: 20px;
                z-index: 10;

                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                flex-wrap: wrap;

                max-width: 280px;
                padding: 16px;
                background-color: white;
                border-radius: 16px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 280px;
                box-sizing: border-box;
                flex-direction: column;
            }

            #controlesMusica button
            {
                font-size: 14px;
                padding: 10px 10px;
            }

            #controlesMusica label
            {
                color: deeppink;
                font-weight: bold;
            }

            #volumen
            {
                accent-color: deeppink;
                width: 100%;
            }

            #tituloMusica
            {
                margin: 0;
                color: deeppink;
                font-size: 16px;
                font-weight: bold;
            }

            #botonesMusica
            {
                display: flex;
                gap: 10px;
            }

            @media (max-width: 600px)
            {
                h1
                {
                    font-size: 30px;
                }

                #tarjeta
                {
                    padding: 24px;
                }

                #contador
                {
                    font-size: 18px;
                    padding: 16px;
                }

                #controlesMusica
                {
                    top: 10px;
                    right: 10px;
                    width: 180px;
                    padding: 12px;
                }

                #tituloMusica
                {
                    font-size: 14px;
                }

                #controlesMusica button
                {       
                    font-size: 12px;
                    padding: 8px;
                }
            }

            #menu
            {
                display: none;
                background-color: white;
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 400px;
                box-sizing: border-box;
            }

            #menu h2
            {
                color: deeppink;
                font-family: Georgia, 'Times New Roman', serif;
                margin-top: 0;
            }

            #menu button
            {
                display: block;
                width: 100%;
                margin-top: 12px;
                font-size: 20px;
            }

            #carta
            {
                display: none;
                background-color: white;
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 4px 16px gray;
                width: 80%;
                max-width: 500px;
                box-sizing: border-box;
            }

            #carta h2
            {
                color: deeppink;
                font-family: Georgia, 'Times New Roman', serif;
            }

            #carta p
            {
                font-size: 20px;
            }

            #fondoAnimado
            {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                pointer-events: none;
                z-index: -1;
            }

            #fondoAnimado span
            {
                position: absolute;
                font-size: 30px;
                animation: flotar 8s linear infinite;
            }

            @keyframes flotar
            {
                from
                {
                    transform: translateY(100vh);
                    opacity: 0;
                }

                20%
                {
                    opacity: 1;
                }

                80%
                {
                    opacity: 1;
                }

                to
                {
                    transform: translateY(-100px);
                    opacity: 0;
                }
            }

#fondoAnimado span:nth-child(1)
{
    left: 10%;
    font-size: 20px;
    animation-duration: 7s;
}

#fondoAnimado span:nth-child(2)
{
    left: 25%;
    font-size: 30px;
    animation-duration: 9s;
}

#fondoAnimado span:nth-child(3)
{
    left: 40%;
    font-size: 25px;
    animation-duration: 6s;
}
            
            #fondoAnimado span:nth-child(4)
            {
                left: 55%;
                animation-duration: 10s;
            }
            #fondoAnimado span:nth-child(5)
{
    left: 70%;
    animation-duration: 8s;
}

#fondoAnimado span:nth-child(6)
{
    left: 85%;
    animation-duration: 7s;
}

#fondoAnimado span:nth-child(7)
{
    left: 35%;
    animation-duration: 11s;
}

#fondoAnimado span:nth-child(8)
{
    left: 65%;
    animation-duration: 9s;
}
        </style>

    </head>

    <body>
        <div id="fondoAnimado">
            <span>💗</span>
            <span>✨</span>
            <span>💕</span>
            <span>🌸</span>
            <span>💗</span>
            <span>✨</span>
            <span>💕</span>
            <span>🌸</span>
        </div>
        <div id="tarjeta">
        
        <h1> Feliz cumpleaños </h1>
        <p> ¡Felices 23 años! </p>
        <button id="botonSorpresa">Abrí tu sorpresa ✨</button>
        <p id="mensajeSorpresa"> Llegó el día, feliz cumpleaños</p>
        </div>

        <div id="menu">
            <h2>¿Por donde querés empezar 💗</h2>

            <button id="botonMenuCarta">💌 Carta</button>
            <button>🔐 Juego de la Caja fuerte</button>
        </div>

        <div id="carta">
            <h2>💌 Para vos</h2>
            <p>Hay algo que quiero decirte...</p>
            <button id="botonCarta">Abrir carta 💗</button>
        </div>

        <div id="controlesMusica">
            <p id="tituloMusica">¿Querés escuchar algo de música mientras esperás?</p>
            <div id="botonesMusica">
                <button id="botonMusica">▶ Reproducir</button>
                <button id="botonPausa">⏸ Pausar</button>
            </div>

            <label for="volumen">Volumen</label>
            <input id="volumen" type="range" min="0" max="1" step="0.1" value="0.5">

        </div>
        <audio id="musica" loop>
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
        <p id="contador"></p>

        <div id="confeti">

        </div>
        <script> 
        const fechaCumple = new Date("2026-08-29T00:00:00-03:00")
        const tarjeta = document.getElementById("tarjeta")
        const botonSorpresa = document.getElementById("botonSorpresa")
        const mensajeSorpresa = document.getElementById("mensajeSorpresa")
        const confeti = document.getElementById("confeti")
        const botonMusica  = document.getElementById("botonMusica")
        const musica = document.getElementById("musica")
        const botonPausa = document.getElementById("botonPausa")
        const volumen = document.getElementById("volumen")
        const menu = document.getElementById("menu")
        const botonCarta = document.getElementById("botonCarta")
        const carta = document.getElementById("carta")
        const botonMenuCarta = document.getElementById("botonMenuCarta")
        const fondoAnimado  = document.getElementById("fondoAnimado")

        let ahoraOficial
        let momentoConsulta



        musica.volume = volumen.value

        async function obtenerHora() 
        {
            const respuesta = await fetch("https://timeapi.io/api/time/current/zone?timeZone=America/Argentina/Buenos_Aires")
            const datos = await respuesta.json()

            ahoraOficial = new Date(datos.dateTime)
            momentoConsulta = new Date()
        }

        function actualizarContador()
        {
            const tiempoTranscurrido = new Date() - momentoConsulta
            const ahora = new Date(ahoraOficial.getTime() + tiempoTranscurrido)

            const diferencia = fechaCumple - ahora
            const contador = document.getElementById("contador")

            if(diferencia > 0)
            {
                tarjeta.style.display = "none"
                menu.style.display = "none"
                contador.style.display = "block"
                fondoAnimado.style.display = "block"
            }

            else
            {
                tarjeta.style.display = "none"
                menu.style.display = "block"
                contador.style.display = "none"
                fondoAnimado.style.display = "none"
                return 
            }

            const segundos = diferencia/1000
            const segundosEnteros = Math.floor(segundos)

            const dias = segundosEnteros/86400
            const diasEnteros = Math.floor(dias)

            const segundosRestantes = segundosEnteros % 86400
            const horas = segundosRestantes/3600
            const horasEnteras = Math.floor(horas)
            const segundosDespuesDeHoras = segundosRestantes % 3600

            const minutos = segundosDespuesDeHoras / 60
            const minutosEnteros = Math.floor(minutos)

            const segundosEnterosRestantes = segundosDespuesDeHoras % 60

            const diasTexto = String(diasEnteros).padStart(2, "0")
            const horasTexto = String(horasEnteras).padStart(2, "0")
            const minutosTexto = String(minutosEnteros).padStart(2, "0")
            const segundosTexto = String(segundosEnterosRestantes).padStart(2, "0")

            contador.textContent = "Faltan: " + diasTexto + " días, " + horasTexto + " horas, " + minutosTexto + " minutos y " + segundosTexto + " segundos"
        }   

        obtenerHora().then(function()
        {
            actualizarContador()
            setInterval(actualizarContador, 1000)
        })

        botonSorpresa.addEventListener("click", function()
        {
            mensajeSorpresa.style.display = "block"
            botonSorpresa.style.display = "none"
            confeti.textContent = "🎉 🎊 ✨ 🎈 🎉 🎊 ✨"
            confeti.classList.add("confetiAnimado")
        })

        botonMusica.addEventListener("click", function()
        {
            musica.play()
        })

        botonPausa.addEventListener("click", function()
        {
            musica.pause()
        })

        volumen.addEventListener("input", function()
        {
            musica.volume = volumen.value
        })

        botonCarta.addEventListener("click", function()
        {
            menu.style.display = "none"
            carta.style.display = "block"
        })

        botonMenuCarta.addEventListener("click", function()
        {
            menu.style.display = "none"
            carta.style.display = "block"
        })
        
        </script>

    </body>
</html>
